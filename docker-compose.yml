services:

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        PLAINTEXT://:9092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  step1:
    build:
      context: ./step1-log-telemetry-ingestion

    ports:
      - "8081:8081"

    environment:
      STREAMING_SERVICE_URL: http://step2:8082

    depends_on:
      step2:
        condition: service_started


  step2:
    build:
      context: ./step2-realtime-ingestion

    ports:
      - "8082:8082"

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      AI_SERVICE_URL: http://step3:8083

    depends_on:
      kafka:
        condition: service_healthy

      step3:
        condition: service_started


  step3:
    build:
      context: ./step3-ai-intelligence-core

    ports:
      - "8083:8083"

    environment:
      ORCHESTRATION_SERVICE_URL: http://step4:8084

    depends_on:
      step4:
        condition: service_started


  step4:
    build:
      context: ./step4-unified-orchestration-engine

    ports:
      - "8084:8084"

    environment:
      STORAGE_SERVICE_URL: http://step5:8085

    depends_on:
      step5:
        condition: service_started


  step5:
    build:
      context: ./step5-immutable-datastore

    ports:
      - "8085:8085"
