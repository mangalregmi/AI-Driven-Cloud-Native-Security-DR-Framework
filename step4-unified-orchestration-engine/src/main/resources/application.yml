spring:
  application:
    name: unified-orchestration-engine

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

orchestration:
  mode: ${ORCHESTRATION_MODE:simulation}
  kubernetes:
    default-namespace: default

  failover:
    hosted-zone-id: HOSTED_ZONE_ID
    domain-name: service.example.com

storage:
  service:
    url: ${STORAGE_SERVICE_URL:http://localhost:8085}
